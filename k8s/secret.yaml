# Watermark: Living_Sin (intricos777-dot) + AI agents (Hermes, Lia, opencode) - collaborative work
apiVersion: v1
kind: Secret
metadata:
  name: coordination-secrets
  namespace: coordination-system
  labels:
    app.kubernetes.io/name: coordination-server
type: Opaque
stringData:
  # Generate with: openssl rand -hex 64
  COORD_JWT_SECRET: "REPLACE_WITH_GENERATED_SECRET"
  # Generate with: openssl rand -base64 32
  COORD_ROOT_KEY: "REPLACE_WITH_GENERATED_SECRET"
  # Generate with: openssl rand -hex 32
  COORD_ADMIN_TOKEN: "REPLACE_WITH_GENERATED_SECRET"
  # Optional: TLS cert/key (base64 encoded)
  # COORD_TLS_CERT: ""
  # COORD_TLS_KEY: ""
