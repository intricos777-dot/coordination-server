apiVersion: v1
kind: Secret
metadata:
  name: coordination-secrets
  namespace: coordination-system
  labels:
    app.kubernetes.io/name: coordination-server
type: Opaque
stringData:
  # Generate with: openssl rand -hex 64
  COORD_JWT_SECRET: ""
  # Generate with: openssl rand -base64 32
  COORD_ROOT_KEY: ""
  # Generate with: openssl rand -hex 32
  COORD_ADMIN_TOKEN: ""
  # Optional: TLS cert/key (base64 encoded)
  # COORD_TLS_CERT: ""
  # COORD_TLS_KEY: ""