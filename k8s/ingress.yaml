apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coordination-server
  namespace: coordination-system
  labels:
    app.kubernetes.io/name: coordination-server
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/websocket-services: "coordination-external"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - coordination.example.com
    secretName: coordination-tls
  rules:
  - host: coordination.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: coordination-external
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: coordination-external
            port:
              number: 4126